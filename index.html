<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루미라의 공간</title>
<script>try{var t=localStorage.getItem("blog-theme");if(!t)t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="light";}</script>
<meta name="description" content="만들고, 놀고, 기록하는 루미라의 공간">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="alternate" type="application/rss+xml" title="루미라의 공간 RSS" href="/dhamgkdltm.gitblog.io/rss.xml">
<link rel="stylesheet" href="/dhamgkdltm.gitblog.io/style.css">
<link rel="manifest" href="/dhamgkdltm.gitblog.io/manifest.webmanifest">
<meta name="theme-color" content="#0066ff">
<link rel="icon" type="image/svg+xml" href="/dhamgkdltm.gitblog.io/assets/icon.svg">
<link rel="apple-touch-icon" href="/dhamgkdltm.gitblog.io/assets/icon.svg">
</head>
<body>
<header class="site-header">
  <div class="sky-band" id="sky-band">
    <div class="sky-stars"></div>
    <button class="sky-body" id="sky-sun" type="button" aria-label="해 — 왼쪽으로 드래그하거나 눌러서 다크모드 전환">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <radialGradient id="sunGrad" cx="0.38" cy="0.38" r="0.95">
            <stop offset="0%" stop-color="#ffec8a"/>
            <stop offset="100%" stop-color="#ffab1f"/>
          </radialGradient>
        </defs>
        <g class="sun-rays">
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(0 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(30 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(60 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(90 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(120 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(150 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(180 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(210 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(240 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(270 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(300 24 24)"/>
            <rect x="23" y="1.5" width="2" height="7.5" rx="1" fill="#ffb02e" transform="rotate(330 24 24)"/>
        </g>
        <circle cx="24" cy="24" r="10.5" fill="url(#sunGrad)"/>
      </svg>
    </button>
    <button class="sky-body" id="sky-moon" type="button" aria-label="달 — 오른쪽으로 드래그하거나 눌러서 라이트모드 전환">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <radialGradient id="moonGrad" cx="0.35" cy="0.35" r="1.05">
            <stop offset="0%" stop-color="#fdf6d8"/>
            <stop offset="100%" stop-color="#e0cb96"/>
          </radialGradient>
          <mask id="moonMask">
            <rect width="48" height="48" fill="black"/>
            <circle cx="22" cy="24" r="13" fill="white"/>
            <circle cx="31.5" cy="18.5" r="11" fill="black"/>
          </mask>
        </defs>
        <circle cx="22" cy="24" r="13" fill="url(#moonGrad)" mask="url(#moonMask)"/>
      </svg>
    </button>
  </div>
  <div class="wrap">
    <a class="site-title" href="/dhamgkdltm.gitblog.io/">루미라의 공간</a>
    <nav>
      <a href="/dhamgkdltm.gitblog.io/">글 목록</a>
      <span id="auth-area"></span>
    </nav>
  </div>
  <nav id="site-menu" class="site-menu" aria-label="종류 메뉴"></nav>
</header>
<main class="wrap">
  <section class="intro-box">
    <p class="intro-main">안녕하세요, 루미라입니다.</p>
    <p class="intro-sub">만들고, 놀고, 기록하는 걸 좋아해요. 이곳은 제가 이것저것 모아두는 공간입니다.</p>
  </section>
  <h1 id="list-heading">최근 글</h1>
  <form id="search-form" class="search-box" action="/dhamgkdltm.gitblog.io/" method="get">
    <input type="search" name="q" id="search-input" placeholder="제목, 내용, 태그로 검색" aria-label="검색">
    <button type="submit">검색</button>
  </form>
  <p id="list-status" class="form-msg"></p>
  <ul class="post-list" id="post-list"></ul>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>© 2026 루미라의 공간 · 방문자 <span id="site-visit-count">-</span>명</p>
    <button type="button" class="footer-share-btn" id="footer-share-btn">공유하기</button>
    <div id="google_translate_element" class="translate-widget" aria-label="언어 선택"></div>
  </div>
</footer>
<script type="module" src="/dhamgkdltm.gitblog.io/assets/site.js"></script>

<script src="/dhamgkdltm.gitblog.io/assets/menu.js"></script>
<script src="/dhamgkdltm.gitblog.io/assets/bottombar.js"></script>
<script src="/dhamgkdltm.gitblog.io/assets/translate.js"></script>

<nav class="bottom-bar" id="bottom-bar" aria-label="하단 메뉴">
  <form class="bottom-search" id="bottom-search" action="/dhamgkdltm.gitblog.io/" method="get" hidden>
    <input type="search" name="q" id="bottom-search-input" placeholder="제목, 내용, 태그로 검색" aria-label="검색어">
    <button type="submit">검색</button>
    <button type="button" class="bottom-search-close" id="bottom-search-close" aria-label="검색 닫기">✕</button>
  </form>
  <div class="bottom-bar-body">
    <a class="bottom-btn" href="/dhamgkdltm.gitblog.io/"><span class="bottom-icon">🏠</span><span class="bottom-label">홈</span></a>
    <button class="bottom-btn" id="bottom-search-btn" type="button"><span class="bottom-icon">🔍</span><span class="bottom-label">검색</span></button>
  </div>
</nav>
</body>
</html>
