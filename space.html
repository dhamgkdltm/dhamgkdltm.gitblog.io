<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>테스트 우주 — 루미라의 공간</title>
<meta name="description" content="루미라의 공간 테스트 우주: 100x100 셀 공간, 중심은 루미라, 위성은 글 테마">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/dhamgkdltm.gitblog.io/assets/space-v18.css">
<link rel="icon" type="image/svg+xml" href="/dhamgkdltm.gitblog.io/assets/icon.svg">
</head>
<body>
<div id="space-viewport" aria-label="테스트 우주 지도">
  <div id="parallax-far" aria-hidden="true"></div>
  <div id="world">
    <div id="stars"></div>
    <svg id="trail-svg" width="7200" height="7200" viewBox="0 0 7200 7200" aria-hidden="true"></svg>
    <div id="nodes"></div>
  </div>
</div>
<div id="edge-glow" aria-hidden="true"></div>
<div id="sys-glyphs" aria-hidden="true"></div>

<div id="cell-marker" aria-hidden="true"></div>
<div id="comet" aria-hidden="true">
  <div id="comet-head"></div>
</div>
<div id="heading" aria-hidden="true">▲</div>
<div id="joystick" hidden aria-hidden="true"><div id="joy-knob"></div></div>

<header id="hud">
  <div class="hud-left">
    <a class="hud-home" href="/dhamgkdltm.gitblog.io/">🏠 홈으로</a>
    <span class="hud-title">테스트 우주 <span class="hud-badge">TEST v18</span></span>
  </div>
  <div class="hud-readout" id="readout">루미라 기준 · 위치를 불러오는 중…</div>
</header>

<p id="hint">빈 곳을 눌러 이동 · 화살표가 방향 표시 · 계 경계를 넘으면 확대</p>
<p id="space-status"></p>

<aside id="popup" hidden>
  <button type="button" id="popup-close" aria-label="닫기">✕</button>
  <h2 id="popup-title"></h2>
  <p id="popup-meta"></p>
  <div id="popup-body"></div>
</aside>

<script src="/dhamgkdltm.gitblog.io/assets/space-v18.js"></script>
</body>
</html>
